
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Selective Attention Study</title>

  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet">

  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
</head>

<body>
<script>

// Step 1: Initialize jsPsych
const jsPsych = initJsPsych({
  extensions: [
    {
      type: jsPsychExtensionPipe,
      params: {
        experiment_id: "B19EGnjvuEar",
        filename: () => `${subject_id}.csv`
      }
    }
  ]
});

// Step 2: Generate participant ID
const subject_id = jsPsych.randomization.randomID(10);

// Step 3: Create test trials
const timeline = [];

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2>Selective Attention Study</h2>
    <p>Welcome! This is a test of the experiment system.</p>
    <p>Click Start to continue.</p>
  `,
  choices: ["Start"]
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h3>Connection test</h3>
    <p>jsPsych is working!</p>
    <p>Click Finish to complete the test.</p>
  `,
  choices: ["Finish"]
});

// Step 4: Run experiment
jsPsych.run(timeline);

</script>
</body>
</html>
