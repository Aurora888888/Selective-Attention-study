
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Selective Attention Study</title>

  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet">

  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>

  <script src="https://unpkg.com/@jspsych/plugin-pipe@1.0.1"></script>
</head>

<body></body>

<script>
const jsPsych = initJsPsych();

const timeline = [];

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2>Selective Attention Study</h2>
    <p>Welcome! This is a test of the experiment system.</p>
    <p>Click Start to continue.</p>
  `,
  choices: ["Start"]
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: "<p>DataPipe connection test.</p>",
  choices: ["Finish"]
});

timeline.push({
  type: jsPsychPipe,
  action: "save",
  experiment_id: "B19EGnjvuEar",
  filename: "test_data.csv",
  data_string: () => jsPsych.data.get().csv()
});

jsPsych.run(timeline);
</script>
</html>
